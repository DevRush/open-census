<meta name="claude:viewport-fit-sides" content="cover">
<title>Open Census</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Open Census · "Spectrum" look. Charcoal system bar, light workspace tabs, white patient sidebar, and chart tabs that each own a hue.
   The hue of a tab (--h) follows its data: the tab itself, the panels and table headers of that tab, and the Summary panels that summarise it.
   Status colours (critical, warning, ok, low) are separate tokens and never reuse a tab hue. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f6f7f9; --surface-3:#e9ecf0; --ws:#e3e6ea; --line:#d3d7dd; --line-2:#e7eaee;
  --ink:#1b1f26; --ink-2:#474e5a; --ink-3:#646c79;
  --accent:#3b4a63; --accent-ink:#ffffff; --accent-soft:#e3e8f0; --sel:#dfe5ee;
  --warn:#8f5a00; --warn-soft:#fcecc6; --crit:#c02a1f; --crit-soft:#fbe3e0;
  --ok:#1b7340; --ok-soft:#dcefe1; --low:#3730a3; --low-soft:#e5e4fa;
  --band:#20242b; --band-2:#343a44; --band-ink:#eef0f3; --band-dim:#a9b0bb;
  --on-fill:#ffffff; --on-h:#ffffff; --mixk:#000000; --shade:rgba(15,20,30,.18); --scrim:rgba(10,14,20,.5);
  --h-summary:#4a5568; --h-review:#6d4fc9; --h-results:#0a7c93; --h-flows:#b3347f; --h-meds:#2460c4; --h-orders:#66740f;
  --h-notes:#8a5a3c; --h-history:#3d7a6a; --h-discharge:#c0496b; --h-coding:#5d6b8a; --h-key:#40464f;
  --k1:#c0334d; --k2:#b5651d; --k3:#6d4fc9; --k4:#2460c4; --k5:#0a7c93; --k6:#5b6676;
  --acu1:#c02a1f; --acu2:#c4501c; --acu3:#8f5a00; --acu4:#1b7340; --acu5:#3730a3;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --code:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --h:var(--h-summary);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#171b21; --surface-2:#1c2128; --surface-3:#262c35; --ws:#1a1e24; --line:#363e4a; --line-2:#272e37;
  --ink:#e7ebf0; --ink-2:#b4bcc8; --ink-3:#8d97a6;
  --accent:#a3b8de; --accent-ink:#0f1216; --accent-soft:#243147; --sel:#26364f;
  --warn:#f0b758; --warn-soft:#3b2d10; --crit:#ff8d83; --crit-soft:#45211e;
  --ok:#7fd096; --ok-soft:#173322; --low:#aca8ff; --low-soft:#28264d;
  --band:#0a0c0f; --band-2:#262b33; --band-ink:#e7ebf0; --band-dim:#8d97a6;
  --on-fill:#ffffff; --on-h:#0f1216; --mixk:#ffffff; --shade:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
  --h-summary:#a2adc2; --h-review:#ad98f2; --h-results:#52c3d8; --h-flows:#e67fba; --h-meds:#80abf3; --h-orders:#b6c64f;
  --h-notes:#d7a27f; --h-history:#80c6b2; --h-discharge:#f28fa9; --h-coding:#a8b4cf; --h-key:#b9bfc9;
  --k1:#ff8aa0; --k2:#f0a868; --k3:#c39df5; --k4:#7fb0ff; --k5:#5fcdb8; --k6:#9aa7b8;
  --acu1:#c4372c; --acu2:#b9551f; --acu3:#94640a; --acu4:#24794a; --acu5:#4a44b8;
  --h:var(--h-summary); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#1c2128; --surface-3:#262c35; --ws:#1a1e24; --line:#363e4a; --line-2:#272e37;
  --ink:#e7ebf0; --ink-2:#b4bcc8; --ink-3:#8d97a6;
  --accent:#a3b8de; --accent-ink:#0f1216; --accent-soft:#243147; --sel:#26364f;
  --warn:#f0b758; --warn-soft:#3b2d10; --crit:#ff8d83; --crit-soft:#45211e;
  --ok:#7fd096; --ok-soft:#173322; --low:#aca8ff; --low-soft:#28264d;
  --band:#0a0c0f; --band-2:#262b33; --band-ink:#e7ebf0; --band-dim:#8d97a6;
  --on-fill:#ffffff; --on-h:#0f1216; --mixk:#ffffff; --shade:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
  --h-summary:#a2adc2; --h-review:#ad98f2; --h-results:#52c3d8; --h-flows:#e67fba; --h-meds:#80abf3; --h-orders:#b6c64f;
  --h-notes:#d7a27f; --h-history:#80c6b2; --h-discharge:#f28fa9; --h-coding:#a8b4cf; --h-key:#b9bfc9;
  --k1:#ff8aa0; --k2:#f0a868; --k3:#c39df5; --k4:#7fb0ff; --k5:#5fcdb8; --k6:#9aa7b8;
  --acu1:#c4372c; --acu2:#b9551f; --acu3:#94640a; --acu4:#24794a; --acu5:#4a44b8;
  --h:var(--h-summary); color-scheme:dark }
/* activity hues: a class sets --h for everything inside it */
.h-summary{--h:var(--h-summary)}.h-review{--h:var(--h-review)}.h-results{--h:var(--h-results)}.h-flows{--h:var(--h-flows)}.h-meds{--h:var(--h-meds)}.h-orders{--h:var(--h-orders)}
.h-notes{--h:var(--h-notes)}.h-history{--h:var(--h-history)}.h-discharge{--h:var(--h-discharge)}.h-coding{--h:var(--h-coding)}.h-key{--h:var(--h-key)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.38;overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
/* system bar */
.top{background:var(--band);color:var(--band-ink);display:flex;align-items:center;gap:4px 8px;padding:5px 12px;flex-wrap:wrap;min-height:40px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap;margin-right:6px}
.brand svg{width:18px;height:18px;flex:none}
.tbtn{background:transparent;border:1px solid transparent;color:var(--band-ink);border-radius:6px;padding:4px 7px;white-space:nowrap;opacity:.88}
.tbtn:hover{opacity:1;background:var(--band-2)}
.tbtn[aria-current="true"]{opacity:1;background:var(--band-2);box-shadow:inset 0 -2px 0 var(--band-ink)}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:17px;border-radius:9px;background:var(--crit);color:var(--surface);font-size:11px;padding:0 5px;margin-left:5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.cnt.n{background:var(--band-2);color:var(--band-ink)}
.srch{position:relative;flex:1 1 96px;min-width:90px;max-width:250px}
.top .srch input{width:100%;background:var(--band-2);border:1px solid var(--band-2);color:var(--band-ink);border-radius:6px;padding:4px 10px}
.srch input::placeholder{color:var(--band-dim)}
#gres{position:absolute;top:100%;left:0;right:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 22px var(--shade);z-index:30;margin-top:3px;overflow:hidden}
#gres button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px}
#gres button:hover{background:var(--sel)}
.sp{flex:1}
.clock{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;white-space:nowrap;margin-right:2px}
.clk{display:flex;align-items:center;gap:3px;white-space:nowrap}
.tbtn.sm{padding:2px 7px;font-size:12px;border-color:var(--band-2)}
.tbtn[aria-pressed="true"]{background:var(--band-2);border-color:var(--band-dim)}
.user{display:flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.15;min-width:0}
.user .uav{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--band-ink);color:var(--band);font-size:11px;font-weight:700;flex:none}
.user small{display:block;font-size:11px;color:var(--band-dim);overflow:hidden;text-overflow:ellipsis;max-width:200px}
.user b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.navs{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
/* workspace tabs */
.wtabs{background:var(--ws);display:flex;align-items:flex-end;gap:2px;padding:4px 10px 0;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
.wtab{display:flex;align-items:center;color:var(--ink-2);border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;white-space:nowrap;margin-bottom:-1px}
.wtab:hover{background:color-mix(in srgb,var(--surface) 50%,var(--ws))}
.wtab[aria-current="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:600;box-shadow:inset 0 3px 0 var(--u,var(--h-summary))}
.wtab button{background:none;border:0;color:inherit;padding:6px 10px;font-weight:inherit;display:flex;align-items:center;gap:7px}
.wtab .wb{font-size:11.5px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.wtab .x{padding:6px 9px 6px 0;color:var(--ink-3)}
.wsr{margin-left:auto;align-self:center;font-size:12px;color:var(--ink-3);white-space:nowrap;padding:0 4px 3px}
.work{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.status{background:var(--surface-2);border-top:1px solid var(--line);color:var(--ink-2);font-size:12px;padding:3px 12px;display:flex;align-items:center;gap:4px 18px;flex-wrap:wrap;flex:none}
.status button.link{font-size:12px}
/* common */
.pill{display:inline-block;border-radius:10px;padding:0 7px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.mute{background:var(--surface-3);color:var(--ink-2)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.low{background:var(--low-soft);color:var(--low)}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6;background:color-mix(in srgb,var(--h) 13%,var(--surface));color:color-mix(in srgb,var(--h) 82%,var(--mixk));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 45%,transparent)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 11px;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--surface-2);border-color:color-mix(in srgb,var(--h) 40%,var(--line))}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:1px 8px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actv .btn.pri,.dlg .btn.pri{background:var(--h);border-color:var(--h);color:var(--on-h)}
.actv .btn[aria-pressed="true"]{background:var(--h);border-color:var(--h);color:var(--on-h)}
.nw{white-space:nowrap}
.muted{color:var(--ink-3)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;padding:6px 12px;background:color-mix(in srgb,var(--h) 8%,var(--surface));border-bottom:1px solid var(--line);flex:none}
.bar h2{font-size:15px;font-weight:700;margin:0 8px 0 0;color:color-mix(in srgb,var(--h) 82%,var(--mixk))}
.split{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr)}
.split.three{grid-template-columns:200px minmax(0,1fr) 320px}
.pane{min-height:0;min-width:0;overflow:auto;background:var(--surface)}
.pane.side{background:var(--surface-2);border-right:1px solid var(--line);padding:6px}
.pane.aside{border-left:1px solid var(--line);padding:10px;background:var(--bg)}
.tree{display:flex;flex-direction:column;gap:1px}
.tree h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:9px 8px 3px;font-weight:700}
.tree button{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:4px 8px;color:var(--ink)}
.tree button:hover{background:var(--surface-3)}
.tree button[aria-current="true"]{background:color-mix(in srgb,var(--h) 14%,var(--surface));color:color-mix(in srgb,var(--h) 80%,var(--mixk));font-weight:700;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 55%,transparent)}
.tree button span{color:var(--ink-3);font-weight:500;font-size:11.5px;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-width:100%}
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
table.g th,table.g td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:4px 8px;text-align:left;vertical-align:top;background:var(--surface)}
table.g thead th{position:sticky;top:0;background:color-mix(in srgb,var(--h) 8%,var(--surface));font-weight:600;font-size:11.5px;color:var(--ink-2);white-space:nowrap;z-index:2;border-bottom:1px solid color-mix(in srgb,var(--h) 30%,var(--line))}
table.g tbody tr:nth-child(even) td{background:var(--surface-2)}
table.g td.n,table.g th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.g .st{position:sticky;left:0;z-index:1;min-width:170px;max-width:220px;font-weight:600;border-right:1px solid var(--line)}
table.g thead .st{z-index:3}
table.g td small,table.g th small{color:var(--ink-3);font-weight:400}
table.g td.hi,table.g tbody tr:nth-child(even) td.hi{background:color-mix(in srgb,var(--crit) 9%,var(--surface));color:var(--crit);font-weight:700}
table.g td.lo,table.g tbody tr:nth-child(even) td.lo{background:color-mix(in srgb,var(--low) 9%,var(--surface));color:var(--low);font-weight:700}
table.g td.txt{min-width:140px;max-width:220px}
table.g tr.sum td,table.g tbody tr.sum:nth-child(even) td{font-weight:700;background:var(--surface-3)}
table.g tr.grp td,table.g tbody tr.grp:nth-child(even) td{background:color-mix(in srgb,var(--h) 12%,var(--surface));font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--h) 80%,var(--mixk));font-weight:700}
table.g tr.row{cursor:pointer}
table.g tr.row:hover td{background:var(--sel)}
table.g tr.on td,table.g tbody tr.on:nth-child(even) td{background:color-mix(in srgb,var(--h) 14%,var(--surface))}
table.g td.c{cursor:pointer} table.g td.c:hover{outline:2px solid var(--h);outline-offset:-2px}
table.g td.new{font-weight:700}
table.g td.nowc,table.g th.nowc{box-shadow:inset 2px 0 0 var(--h),inset -2px 0 0 var(--h)}
table.g input{width:70px;font-family:var(--mono);background:var(--surface);border:1px solid var(--h);border-radius:4px;padding:1px 4px;text-align:right}
td.rg,th.rg{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
/* result flags: a letter chip beside the value; solid when far outside the range */
.fg{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:16px;padding:0 3px;margin-left:5px;border-radius:3px;font-size:10.5px;font-weight:700;font-style:normal;vertical-align:1px;line-height:1}
.fg.hi{background:var(--crit-soft);color:var(--crit);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--crit) 35%,transparent)}
.fg.lo{background:var(--low-soft);color:var(--low);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--low) 35%,transparent)}
.fg.hi.x{background:var(--crit);color:var(--surface)}.fg.lo.x{background:var(--low);color:var(--surface)}
/* chart frame */
.kv{display:flex;flex-direction:column}
.kv small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.actv{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.abody{flex:1;min-height:0;overflow:auto;padding:10px}
.abody.flush{padding:0;display:flex;flex-direction:column}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;align-items:start}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
/* panels */
.w{background:var(--surface);border:1px solid color-mix(in srgb,var(--h) 60%,var(--line));border-radius:6px;min-width:0;overflow:hidden}
.w>h3{margin:0;padding:6px 12px;min-height:32px;background:color-mix(in srgb,var(--h) 10%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--h) 26%,var(--line));font-size:13.5px;font-weight:700;color:color-mix(in srgb,var(--h) 80%,var(--mixk));display:flex;align-items:center;flex-wrap:wrap;gap:3px 10px}
.w>h3>span{font-weight:500;color:var(--ink-3);font-size:12.5px}
.w>h3 .pl,.pl{margin-left:auto;background:var(--h);color:var(--on-h);border:0;border-radius:10px;padding:1px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pl::after{content:" ›"}
.pl:hover{filter:brightness(1.1)}
.w .wb{padding:8px 12px}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ol.prob{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:4px}
ol.prob li{counter-increment:p;display:grid;grid-template-columns:18px minmax(0,1fr);line-height:1.3}
ol.prob li::before{content:counter(p);color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px}
.link{background:none;border:0;padding:0;color:color-mix(in srgb,var(--h) 85%,var(--mixk));text-decoration:underline;text-underline-offset:2px;text-align:left}
/* vitals rows (summary) */
.vrow{display:grid;grid-template-columns:minmax(92px,1.15fr) minmax(70px,auto) minmax(60px,1fr) minmax(64px,auto);gap:10px;align-items:center;min-height:34px;border-bottom:1px solid var(--line-2)}
.vrow:last-child{border-bottom:0}
.vrow .vl{color:var(--ink-2)}
.vrow .vv{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.vrow .vv small{font-weight:500;font-size:11px;color:var(--ink-3);margin-left:3px}
.vrow .vv.hi{color:var(--crit)}.vrow .vv.lo{color:var(--low)}
.vrow .vr{color:var(--ink-3);font-size:12px;text-align:right;white-space:nowrap}
.vrow svg{display:block;width:100%;height:24px}
/* summary grid */
.sgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;align-items:start}
.sgrid>*{grid-column:span 4;min-width:0}
.sgrid>.s5{grid-column:span 5}.sgrid>.s7{grid-column:span 7}.sgrid>.s3{grid-column:span 3}.sgrid>.s6{grid-column:span 6}
@media (max-width:1280px){.sgrid>.s5,.sgrid>.s7{grid-column:span 12}.sgrid>*,.sgrid>.s3,.sgrid>.s6{grid-column:span 6}}
@media (max-width:760px){.sgrid>*,.sgrid>.s3,.sgrid>.s5,.sgrid>.s6,.sgrid>.s7{grid-column:span 12}}
table.rt{border-collapse:collapse;width:100%;font-size:13px}
table.rt th{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rt td{padding:5px 6px;border-bottom:1px solid var(--line-2);white-space:nowrap;font-variant-numeric:tabular-nums}
table.rt tr:last-child td{border-bottom:0}
table.rt .n{text-align:right}
table.rt td.v{font-weight:700;text-align:right}
table.rt td.v.hi{color:var(--crit)}table.rt td.v.lo{color:var(--low)}
table.rt .rg{color:var(--ink-2);font-size:12px}
table.rt td:first-child,table.rt th:first-child{padding-left:0}
/* medications by hour (summary) */
table.mbh{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12.5px}
table.mbh th{font-size:11px;font-weight:600;color:var(--ink-3);text-align:center;padding:3px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

.bub{max-width:min(74%,560px);border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);align-self:flex-start;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.bub small{display:block;color:var(--ink-3);font-size:11px}
.csend{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface-2)}
.csend input{flex:1}
pre.json{margin:0;font-family:var(--code);font-size:12px;line-height:1.45;white-space:pre;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:100%;tab-size:2}
.req{font-family:var(--code);font-size:12px;background:var(--surface-3);border-radius:4px;padding:3px 8px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 26px;max-width:720px;margin:0 auto;box-shadow:0 2px 10px var(--shade)}
.paper h1{font-size:21px;margin:0 0 2px}.paper h3{font-size:13px;margin:14px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px;color:color-mix(in srgb,var(--h) 80%,var(--mixk))}
.paper p,.paper li{font-size:13px;line-height:1.5}.paper ul{margin:0;padding-left:18px}
.ck{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.ck .m{width:18px;height:18px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.ck .m.y{background:var(--ok-soft);color:var(--ok)}.ck .m.n{background:var(--crit-soft);color:var(--crit)}
input[type=number],input[type=time]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 7px;max-width:100%;min-width:0}
textarea.med{min-height:130px}
.hourh td{background:var(--surface-3)!important;font-size:11.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:1440px){.user small{display:none}}
@media (max-width:900px){
  html,body{height:auto} body{overflow:auto}
  .chart,.chat{grid-template-columns:minmax(0,1fr)}
  .pside{overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
  .ps-toggle{display:inline-block;align-self:flex-start}
  .pside:not(.open) .ps-more{display:none}
  .clog{overflow:visible;min-height:220px}
  .navs{flex-wrap:nowrap;overflow-x:auto;max-width:100%}
  .user b{max-width:150px}
  pre.json{max-height:70vh}
  .paper{padding:14px}
  .app{height:auto;min-height:100%}
  .split,.split.three{grid-template-columns:minmax(0,1fr)!important}
  .split{height:auto!important}
  .pane,.abody{overflow:visible}
  .pane.side{border-right:0;border-bottom:1px solid var(--line)}
  .pane.aside{border-left:0;border-top:1px solid var(--line)}
  .pane.side .tree{flex-direction:row;overflow-x:auto}
  .pane.side .tree h3{display:none}
  .tree button{white-space:nowrap;width:auto}
  table.g .st{min-width:120px;max-width:140px}
  .frm{grid-template-columns:minmax(0,1fr)}
  .vrow{grid-template-columns:minmax(80px,1fr) auto minmax(40px,.8fr) auto;gap:8px}
  .tgrid,.tgrid.dept{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tile{padding:5px 8px 5px 28px}
  .tile small{display:none}
}

/* ---------- unit board ---------- */
function vBoard(){
  var tot=0,occ=0,cl=0,rs=0,st=['Available','Being cleaned','Reserved for admission'];
  var secs=UNITS.filter(function(u){return u[4];}).map(function(u,ui){
    var beds=S.P.filter(function(p){return p.unitKey===u[0];}).map(function(p){return p.discharged?{bed:p.bed,empty:'Being cleaned',dis:p.discharged}:{bed:p.bed,name:p.name,as:ageOf(p)+' '+p.sex,dx:p.dx,id:p.id,code:p.code};})
      .concat(FILL.filter(function(f){return f[0]===u[0];}).map(function(f){return {bed:f[1],name:f[2],as:f[3]+' '+f[4],dx:f[7],code:f[9]};}));
    var used={},n=1,k=ui,o=beds.filter(function(b){return !b.empty;}).length;beds.forEach(function(b){used[b.bed]=1;if(b.dis)cl++;});
    while(beds.length<u[4]&&n<60){var lab=u[3]+'-'+p2(n);if(!used[lab]){beds.push({bed:lab,empty:st[k%3]});if(k%3===1)cl++;if(k%3===2)rs++;k++;}n++;}
    beds.sort(function(a,b){return a.bed<b.bed?-1:1;});tot+=Math.max(u[4],beds.length);occ+=o;
    if(S.ub!=='all'&&S.ub!==u[0])return '';
    return '<section class="usec" style="--u:'+u[2]+'"><h3><i class="dot"></i>'+u[1]+'<span class="meter"><i style="width:'+Math.min(100,Math.round(o/u[4]*100))+'%"></i></span><span class="occ">'+o+' of '+u[4]+' beds occupied</span></h3><div class="beds">'+beds.map(function(b){
      return b.empty?'<div class="bt empty"><span class="bn"><span>'+b.bed+'</span></span><b style="font-weight:500">'+b.empty+'</b>'+(b.dis?'<span class="dx">Patient discharged '+hm(b.dis)+'</span>':'')+'</div>':
       '<button class="bt'+(b.id?' full':'')+'" data-a="'+(b.id?'open':'fill')+'" data-v="'+(b.id||'')+'"><span class="bn"><span>'+b.bed+'</span><span>'+b.as+'</span></span><b>'+esc(b.name)+'</b><span class="dx">'+esc(b.dx)+'</span>'+(b.code!=='Full code'?'<span class="pill warn">'+esc(b.code)+'</span>':'')+'</button>';}).join('')+'</div></section>';}).join('');
  var board=EDR.filter(function(r){return r[8].indexOf('Admitted')===0;}).length+S.P.filter(function(p){return p.unitKey==='ed';}).length;
  return '<div class="bar"><h2>Unit board</h2><button class="chip" data-a="ub" data-v="all" aria-pressed="'+(S.ub==='all')+'">All units</button>'+UNITS.filter(function(u){return u[4];}).map(function(u){return '<button class="chip" style="--u:'+u[2]+'" data-a="ub" data-v="'+u[0]+'" aria-pressed="'+(S.ub===u[0])+'"><i class="dot"></i>'+u[1]+'</button>';}).join('')+'</div>'+
   '<div class="pane" style="flex:1" data-sc="board'+S.ub+'"><div class="kpis"><div class="kpi"><b>'+occ+' / '+tot+'</b><span>Beds occupied</span></div><div class="kpi" style="--wk:var(--k5)"><b>'+(tot-occ-cl-rs)+'</b><span>Available now</span></div><div class="kpi" style="--wk:var(--k2)"><b>'+cl+'</b><span>Being cleaned</span></div><div class="kpi" style="--wk:var(--k3)"><b>'+rs+'</b><span>Reserved</span></div><div class="kpi" style="--wk:var(--k1)"><b>'+board+'</b><span>Waiting in emergency for a bed</span></div></div>'+
   '<div class="ub">'+secs+'<p class="muted" style="margin:0">Beds with an outlined border have a full practice chart. Select one to open it.</p></div></div>';

/* ---------- chart frame ---------- */
function vChart(p){
  var c=S.c[p.id],los=Math.floor((NOW-p.admit)/86400000)+1,d=dueOf(p),nm=p.name.split(', '),v=vit(p);
  var uns=c.basket.length+p.orders.filter(function(o){return o.st==='Needs cosign'||o.needSig;}).length;
  var ncs=p.notes.filter(function(n){return (n.cosign||/PGY-1|student/i.test(n.by))&&!n.cosigned;}).length;
  var badge={meds:d[0]?'<span class="cnt'+(d[1]?'':' hb')+'"'+(d[1]?' data-tip="'+d[1]+' overdue"':'')+'>'+d[0]+'</span>':'',orders:uns?'<span class="cnt">'+uns+'</span>':'',results:p.pending.length?'<span class="cnt hb" data-tip="Results pending">'+p.pending.length+'</span>':'',notes:isAtt()&&ncs?'<span class="cnt hb" data-tip="Notes waiting for cosign">'+ncs+'</span>':''};
  var due=[];
  p.meds.forEach(function(m){m.a.forEach(function(a){var s=doseState(a);if(s==='over')due.push([a.t,'crit','Overdue',m.name,'meds']);else if(s==='due')due.push([a.t,'warn','Due',m.name,'meds']);});});
  p.pending.forEach(function(x){due.push([x.t,'acc','Pending',x.text,'results']);});
  p.orders.forEach(function(o){if(o.st==='Needs cosign')due.push([o.t,'warn','Cosign',o.text.split(' · ')[0],'orders']);else if(o.needSig)due.push([o.t,'warn','Sign',o.text.split(' · ')[0],'orders']);});
  due.sort(function(a,b){return a[0]-b[0];});
  function fv(k,lab,val,f){f=f===undefined?v.f[k]:f;return '<span class="'+(f||'')+'"><i>'+lab+'</i><b>'+val+(f?(f==='hi'?' ↑':' ↓'):'')+'</b></span>';}
  var real=p.allergies.filter(function(a){return a[0]!=='No known allergies';});

function paintStrips(){
  Array.prototype.forEach.call(document.querySelectorAll('canvas.strip'),function(cv){
    var x=cv.getContext('2d'),W=cv.width,H=cv.height,cs=getComputedStyle(document.documentElement),hr=+cv.dataset.hr,irr=cv.dataset.irr==='1',rd=rng(hr*7+(irr?1:0)),pps=118,beats=[],t=0.25;
    while(t<W/pps+1){beats.push(t);t+=60/hr*(irr?0.62+rd()*0.8:0.985+rd()*0.03);}
    x.clearRect(0,0,W,H);x.strokeStyle=cs.getPropertyValue('--line-2');x.lineWidth=1;x.beginPath();for(var g=0;g<W;g+=pps/5){x.moveTo(g,0);x.lineTo(g,H);}for(g=0;g<H;g+=pps/5){x.moveTo(0,g);x.lineTo(W,g);}x.stroke();
    function ga(u,m,s,a){return a*Math.exp(-(u-m)*(u-m)/(2*s*s));}
    x.strokeStyle=cs.getPropertyValue('--ok');x.lineWidth=1.6;x.lineJoin='round';x.beginPath();
    for(var px=0;px<W;px++){var u=px/pps,y=0;beats.forEach(function(b){var d=u-b;if(d<-0.4||d>0.5)return;y+=(irr?0:ga(d,-0.17,0.022,5))+ga(d,-0.028,0.008,-5)+ga(d,0,0.009,40)+ga(d,0.03,0.01,-9)+ga(d,0.25,0.045,9);});
      if(irr)y+=1.6*Math.sin(u*41)+1.1*Math.sin(u*67+1);y=H*0.62-y;if(px)x.lineTo(px,y);else x.moveTo(px,y);}

}
function spark(vals){var v=vals.filter(function(x){return typeof x==='number';}).slice(-12);if(v.length<2)return '<span></span>';

function aResults(p,c){
  var tree='<div class="tree"><h3>Laboratory</h3><button data-a="rsel" data-v="all" aria-current="'+(c.rsel==='all')+'">All results<span>'+p.labs.length+' panels</span></button>'+p.labs.map(function(L,i){return '<button data-a="rsel" data-v="lab'+i+'" aria-current="'+(c.rsel==='lab'+i)+'">'+esc(L.panel)+'<span>'+L.times.length+'</span></button>';}).join('')+
    '<h3>Reports</h3>'+[['micro','Microbiology'],['imaging','Imaging'],['path','Pathology']].map(function(r){return '<button data-a="rsel" data-v="'+r[0]+'" aria-current="'+(c.rsel===r[0])+'">'+r[1]+'<span>'+p[r[0]].length+'</span></button>';}).join('')+'</div>';
  var body;
  if(c.rsel==='all')body=allLabs(p,c);
  else if(c.rsel.indexOf('lab')===0){var pi=+c.rsel.slice(3),L=p.labs[pi];
    body='<div style="padding:10px">'+(p.pending.length?'<p style="margin:0 0 8px"><span class="pill warn">Pending</span> '+p.pending.map(function(x){return esc(x.text)+' (ordered '+hm(x.t)+(x.due?', expected about '+hm(x.due):'')+')';}).join(' · ')+'</p>':'')+
      (c.graph&&c.graph.pi===pi?'<div class="w" style="margin-bottom:10px"><h3>'+esc(L.rows[c.graph.ri][0])+' <span><button class="link" data-a="gclose">Close graph</button></span></h3><div class="wb">'+trendSvg(L.rows[c.graph.ri],L.times)+'</div></div>':'')+
      '<div class="scroll"><table class="g" style="width:auto"><thead><tr><th class="st">'+esc(L.panel)+'</th><th>Range</th>'+L.times.map(function(t){return '<th class="n">'+dm(t)+'<br>'+hm(t)+'</th>';}).join('')+'<th></th></tr></thead><tbody>'+
      L.rows.map(function(r,ri){var dc=decs(r[4]);return '<tr'+(c.graph&&c.graph.pi===pi&&c.graph.ri===ri?' class="on"':'')+'><td class="st">'+esc(r[0])+' <small>'+esc(r[1])+'</small></td><td class="rg">'+rngT(r)+'</td>'+
        r[4].map(function(v,ti){var f=flagOf(v,r[2],r[3]),nw=NOW-L.times[ti]<12*3600000;return v==null?'<td></td>':'<td class="n c '+f+(nw?' new':'')+'" data-a="cell" data-v="'+pi+','+ri+','+ti+'" tabindex="0">'+(dc?v.toFixed(dc):num(v))+fchip(v,r[2],r[3])+'</td>';}).join('')+
        '<td><button class="btn sm" data-a="graph" data-v="'+pi+','+ri+'">Graph</button></td></tr>';}).join('')+'</tbody></table></div>'+
      '<p class="muted" style="margin:8px 0 0">Select a value for its details. H is above range, L is below. Bold values arrived in the last 12 hours.</p></div>';
  } else {var arr=p[c.rsel],x=arr[c.rep]||arr[0],img='';
    if(c.rsel==='imaging'&&x){var ik=SIMIMG.kind(x.title);
      if(ik==='ecg')img='<div class="imgbox ecg"><div class="ib"><canvas class="ecgc simimg" data-kind="ecg" width="1050" height="560" role="img" aria-label="Simulated 12-lead ECG drawn from the report text"></canvas></div><div class="cap"><span><b>Simulated image.</b> Drawn by the simulator from the report text below (rate, rhythm, conduction, ST and T changes). It is not a real tracing.</span></div></div>';
      else if(ik==='cxr')img='<div class="imgbox"><div class="ib"><canvas class="cxr simimg" data-kind="cxr" width="560" height="620" style="filter:invert('+(c.img.inv?1:0)+') brightness('+c.img.br+'%)" role="img" aria-label="Simulated chest X-ray drawn from the report text"></canvas></div><div class="cap"><span><b>Simulated image.</b> Drawn by the simulator from the report text below. It is not a real radiograph. The patient’s right side is on the left of the picture.</span><span class="sp"></span><button class="btn sm" data-a="imginv" aria-pressed="'+c.img.inv+'">Invert</button><label for="img-br">Brightness</label><input type="range" id="img-br" min="50" max="200" step="5" value="'+c.img.br+'" style="width:110px"></div></div>';
      else img='<p class="muted" style="margin:0 0 12px;padding:8px 10px;border:1px dashed var(--line);border-radius:4px;max-width:74ch">No image is available for this kind of study in the practice set. Only the report is shown.</p>';}
    body=arr.length?'<div class="split" style="grid-template-columns:minmax(0,300px) minmax(0,1fr);height:100%"><div class="pane" style="border-right:1px solid var(--line)">'+arr.map(function(r,i){return '<button class="nrow" data-a="rep" data-v="'+i+'" aria-current="'+(r===x)+'"><b>'+esc(r.title)+'</b><span>'+dt(r.t)+' · '+esc(r.status)+'</span></button>';}).join('')+'</div>'+
      '<div class="pane" style="padding:12px 16px" data-sc="rep'+p.id+c.rsel+c.rep+'"><div class="nhead"><b>'+esc(x.title)+'</b><span>'+dt(x.t)+' · '+esc(x.by)+' · <span class="pill '+(x.status==='Final'?'ok':'warn')+'">'+esc(x.status)+'</span></span></div>'+img+fmtNote(x.body)+'</div></div>':'<p class="muted" style="padding:12px">No results of this type for this admission.</p>';}
  return '<div class="bar"><h2>Results</h2>'+(p.pending.length?'<span class="pill warn">'+p.pending.length+' pending</span>':'')+'</div><div class="abody flush"><div class="split"><div class="pane side">'+tree+'</div><div class="pane" data-sc="res'+p.id+c.rsel+'" data-end="1">'+body+'</div></div></div>';
}
function paintImages(){
  Array.prototype.forEach.call(document.querySelectorAll('canvas.simimg'),function(cv){var p=PT(S.view);if(!p)return;var c=S.c[p.id],x=p.imaging[c.rep]||p.imaging[0];if(!x)return;var seed=+p.mrn.replace(/\D/g,'')%9973+x.t.getDate()*31+x.t.getHours();
    try{if(cv.dataset.kind==='ecg')SIMIMG.ecg(cv,x.body,vit(p).hr,seed);else SIMIMG.cxr(cv,x.body,seed);}catch(e){if(window.console)console.warn('Image not drawn',e);}});
}
function allLabs(p,c){
  var ts=[];p.labs.forEach(function(L){L.times.forEach(function(t){if(ts.indexOf(+t)<0)ts.push(+t);});});ts.sort(function(a,b){return a-b;});
  var G=c.graph?p.labs[c.graph.pi]:null,h='<div style="padding:10px">'+(p.pending.length?'<p style="margin:0 0 8px"><span class="pill warn">Pending</span> '+p.pending.map(function(x){return esc(x.text)+' (ordered '+hm(x.t)+(x.due?', expected about '+hm(x.due):'')+')';}).join(' · ')+'</p>':'')+
    (G?'<div class="w k3" style="margin-bottom:10px"><h3>'+esc(G.rows[c.graph.ri][0])+' <span><button class="link" data-a="gclose">Close graph</button></span></h3><div class="wb">'+trendSvg(G.rows[c.graph.ri],G.times)+'</div></div>':'')+
    '<p style="margin:0 0 8px"><input type="search" id="lab-q" placeholder="Find a test" aria-label="Find a test" autocomplete="off"></p><table class="g" style="width:auto" id="lab-all"><thead><tr><th class="st">Test</th><th>Range</th>'+ts.map(function(t){var d=new Date(t);return '<th class="n">'+dm(d)+'<br>'+hm(d)+'</th>';}).join('')+'</tr></thead><tbody>';
  p.labs.forEach(function(L,pi){h+='<tr class="grp"><td class="st">'+esc(L.panel)+'</td><td colspan="'+(ts.length+1)+'"></td></tr>';
    L.rows.forEach(function(r,ri){var dc=decs(r[4]);h+='<tr data-n="'+esc(r[0].toLowerCase())+'"'+(c.graph&&c.graph.pi===pi&&c.graph.ri===ri?' class="on"':'')+'><td class="st"><button class="link" style="text-decoration:none;color:inherit;font-weight:500" data-a="graph" data-v="'+pi+','+ri+'" data-tip="Graph this test">'+esc(r[0])+' ▸</button> <small>'+esc(r[1])+'</small></td><td class="rg">'+rngT(r)+'</td>'+
      ts.map(function(t){var ti=-1;L.times.forEach(function(x,i){if(+x===t)ti=i;});var v=ti<0?null:r[4][ti];if(v==null)return '<td></td>';var f=flagOf(v,r[2],r[3]);return '<td class="n c '+f+(NOW-t<12*3600000?' new':'')+'" data-a="cell" data-v="'+pi+','+ri+','+ti+'" tabindex="0">'+(dc?v.toFixed(dc):num(v))+fchip(v,r[2],r[3])+'</td>';}).join('')+'</tr>';});});
  return h+'</tbody></table><p class="muted" style="margin:8px 0 0">Every panel on one time line, oldest on the left. Select a value for its details or a test name to graph it.</p></div>';
}
function trendSvg(r,times){
  var pts=[];r[4].forEach(function(v,i){if(v!=null)pts.push({t:times[i],v:v});});
  var W=660,H=200,ml=52,mr=64,mt=16,mb=40,lo=r[2],hi=r[3];
  var vs=pts.map(function(p){return p.v;}),hasR=lo!=null&&hi!=null&&hi<9000&&lo>-1,mn=Math.min.apply(null,vs.concat(hasR?[lo]:[])),mx=Math.max.apply(null,vs.concat(hasR?[hi]:[]));
  var pad=(mx-mn)*0.1||1;mn-=pad;mx+=pad;
  var t0=pts[0].t.getTime(),t1=pts[pts.length-1].t.getTime();
  function X(t){return t1===t0?(ml+(W-ml-mr)/2):ml+(t.getTime()-t0)/(t1-t0)*(W-ml-mr);}
  function Y(v){return mt+(mx-v)/(mx-mn)*(H-mt-mb);}
  var dec=(mx-mn)<3?2:((mx-mn)<30?1:0);
  var s='<div class="scroll"><svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(r[0])+' over time; the values are in the table" style="max-width:none">';
  if(hasR)s+='<rect x="'+ml+'" y="'+Y(hi)+'" width="'+(W-ml-mr)+'" height="'+(Y(lo)-Y(hi))+'" fill="var(--h)" fill-opacity=".1"/>';
  if(hasR)s+='<text x="'+(W-mr+6)+'" y="'+(Y(hi)+4)+'">'+hi+'</text><text x="'+(W-mr+6)+'" y="'+(Y(lo)+4)+'">'+lo+'</text><text x="'+(W-mr+6)+'" y="'+((Y(hi)+Y(lo))/2+4)+'">range</text>';
  for(var i=0;i<4;i++){var gv=mn+(mx-mn)*i/3,gy=Y(gv);s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(ml-8)+'" y="'+(gy+4)+'" text-anchor="end">'+gv.toFixed(dec)+'</text>';}
  s+='<polyline fill="none" stroke="var(--h)" stroke-width="2" stroke-linejoin="round" points="'+pts.map(function(p){return X(p.t).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ')+'"/>';
  var prevDay=null,prevX=-99;
  pts.forEach(function(p,i){var x=X(p.t),y=Y(p.v),f=flagOf(p.v,lo,hi);
    s+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="'+(f?'var(--crit)':'var(--h)')+'" stroke="var(--surface)" stroke-width="2"/><circle cx="'+x+'" cy="'+y+'" r="13" fill="transparent" data-tip="'+esc(dt(p.t)+' · '+num(p.v)+' '+r[1]+(f?(f==='hi'?' (high)':' (low)'):''))+'"/>';
    if(x-prevX>40){s+='<text x="'+x+'" y="'+(H-mb+15)+'" text-anchor="middle">'+hm(p.t)+'</text>';if(dm(p.t)!==prevDay){s+='<text x="'+x+'" y="'+(H-mb+29)+'" text-anchor="middle">'+dm(p.t)+'</text>';prevDay=dm(p.t);}prevX=x;}
    if(i===pts.length-1)s+='<text x="'+x+'" y="'+(y-11)+'" text-anchor="middle" style="fill:var(--ink);font-weight:500;font-size:12px">'+num(p.v)+'</text>';});
  return s+'</svg></div>';
}

/* ---------- flowsheets ---------- */
function aFlows(p,c){
  var g=p.flows[c.fg]||p.flows[0],can=!!g.times;
  var heads=g.times?g.times.map(function(t){return '<th class="n">'+dm(t)+'<br>'+hm(t)+'</th>';}):g.cols.map(function(x){return '<th>'+esc(x)+'</th>';});
  if(c.newcol&&can)heads.push('<th class="n nowc">'+dm(NOW)+'<br>'+hm(NOW)+' new</th>');
  var bp=g.rows.filter(function(x){return x.type==='bp';})[0];
  function series(r){return r.type==='bp'?r.s:(r.type==='map'?bp.s.map(function(s,i){return mapOf(s,bp.d[i]);}):r.v);}
  var rows=g.rows.map(function(r,j){var cells,isSeries=can&&series(r).filter(function(x){return typeof x==='number';}).length>1;
    if(r.type==='bp')cells=r.s.map(function(s,i){return '<td class="n '+(r.lo!=null?flagOf(s,r.lo,r.hi):(s<90?'lo':(s>160?'hi':'')))+'">'+s+'/'+r.d[i]+'</td>';});
    else if(r.type==='map')cells=bp.s.map(function(s,i){var m=mapOf(s,bp.d[i]),f=flagOf(m,r.lo,r.hi);return '<td class="n '+f+'">'+m+'</td>';});
    else cells=r.v.map(function(v){var isN=typeof v==='number',f=flagOf(v,r.lo,r.hi);return '<td class="'+(isN||g.unit?'n ':'txt ')+f+'">'+num(v,isN?(r.dec||(r.k==='temp'?1:0)):0)+'</td>';});
    if(c.newcol&&can)cells.push('<td class="n nowc">'+(r.type==='map'?'':'<input id="fsi'+j+'" type="text" aria-label="'+esc(r.l)+'" placeholder="'+(r.type==='bp'?'120/70':'')+'">')+'</td>');
    return '<tr class="'+(r.sum?'sum':'')+(c.fgraph===j?' on':'')+'"><td class="st">'+(isSeries?'<button class="link" style="text-decoration:none;color:inherit;font-weight:500" data-a="fgr" data-v="'+j+'" data-tip="Graph this row">'+esc(r.l)+' ▸</button>':esc(r.l))+(r.u?' <small>'+esc(r.u)+'</small>':'')+'</td>'+cells.join('')+'</tr>';}).join('');
  var gr='';
  if(can&&c.fgraph!=null&&g.rows[c.fgraph]){var r=g.rows[c.fgraph],sv=series(r),n=Math.max(0,sv.length-24);
    gr='<div class="w k1" style="margin:10px"><h3>'+esc(r.l)+(r.u?' · '+esc(r.u):'')+' <span><button class="link" data-a="fgr" data-v="'+c.fgraph+'">Close graph</button></span></h3><div class="wb">'+trendSvg([r.l,r.u||'',r.type==='bp'?null:r.lo,r.type==='bp'?null:r.hi,sv.slice(n).map(function(x){return typeof x==='number'?x:null;})],g.times.slice(n))+(r.type==='bp'?'<span class="muted">Systolic pressure shown.</span>':'')+'</div></div>';}
  var gv=g.chart&&c.fview==='graph';
  return '<div class="bar"><h2>Flowsheets</h2><span class="muted">'+esc(g.name)+'</span>'+(g.chart?'<button class="btn sm" data-a="fview" data-v="grid" aria-pressed="'+!gv+'">Grid</button><button class="btn sm" data-a="fview" data-v="graph" aria-pressed="'+gv+'">Graph</button>':'')+'<span class="sp"></span>'+(can?(c.newcol?'<button class="btn pri" data-a="filecol">File column</button><button class="btn" data-a="cancelcol">Cancel</button>':'<button class="btn pri" data-a="newcol">Add column at '+hm(NOW)+'</button>'):'<span class="muted">Recorded once per shift</span>')+'</div>'+
   '<div class="abody flush"><div class="split"><div class="pane side"><div class="tree"><h3>Groups</h3>'+p.flows.map(function(f,i){return '<button data-a="fg" data-v="'+i+'" aria-current="'+(f===g)+'">'+esc(f.name)+'</button>';}).join('')+'</div></div>'+
   (gv?'<div class="pane" style="padding:10px" data-sc="vg'+p.id+'" data-end="1">'+vitGraph(g)+'</div></div></div>':'')+(gv?'':'<div class="pane" style="display:flex;flex-direction:column">'+gr+'<div class="scroll" style="flex:1" data-sc="fs'+p.id+c.fg+(c.newcol?'n':'')+'" data-end="1"><table class="g" style="width:auto"><thead><tr><th class="st">'+(g.unit?'Volumes in '+g.unit:esc(g.name))+'</th>'+heads.join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div></div></div></div>');
}

function vitGraph(g){
  var n=g.times.length,step=Math.max(30,Math.min(46,Math.floor(900/n))),ml=104,mr=58,W=ml+mr+step*(n-1),ph=78,gap=14;
  var bp=g.rows.filter(function(r){return r.type==='bp';})[0],R=function(k){return g.rows.filter(function(r){return r.k===k;})[0];};
  var P=[{l:'Heart rate',u:'/min',s:[[R('hr').v,'var(--k1)','']],lo:R('hr').lo,hi:R('hr').hi},{l:'Blood pressure',u:'mmHg',s:[[bp.s,'var(--k4)','systolic'],[bp.d,'var(--k5)','diastolic']]},{l:'Temperature',u:'°C',s:[[R('temp').v,'var(--k2)','']],lo:R('temp').lo,hi:R('temp').hi,d:1},{l:'Respiratory rate',u:'/min',s:[[R('rr').v,'var(--k3)','']],lo:R('rr').lo,hi:R('rr').hi},{l:'Oxygen saturation',u:'%',s:[[R('spo2').v,'var(--k4)','']],lo:R('spo2').lo,hi:R('spo2').hi}];
  var H=P.length*(ph+gap)+30,o='<div class="scroll"><svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Vital signs over time; the same values are in the grid view" style="max-width:none">';
  function X(i){return ml+i*step;}
  P.forEach(function(pn,pi){var y0=pi*(ph+gap)+8,all=[];pn.s.forEach(function(s){s[0].forEach(function(v){if(typeof v==='number')all.push(v);});});
    var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all),pad=(mx-mn)*0.15||1;mn-=pad;mx+=pad;function Y(v){return y0+(mx-v)/(mx-mn)*ph;}
    o+='<rect x="'+ml+'" y="'+y0+'" width="'+(W-ml-mr)+'" height="'+ph+'" fill="var(--surface-2)"/>';
    if(pn.lo!=null&&pn.hi<900){var a=Math.max(y0,Y(Math.min(pn.hi,mx))),b=Math.min(y0+ph,Y(Math.max(pn.lo,mn)));if(b>a)o+='<rect x="'+ml+'" y="'+a+'" width="'+(W-ml-mr)+'" height="'+(b-a)+'" fill="var(--ok-soft)"/>';}
    o+='<text x="6" y="'+(y0+12)+'" style="fill:var(--ink);font-family:var(--sans);font-size:11.5px;font-weight:600">'+pn.l.split(' ')[0]+'</text><text x="6" y="'+(y0+26)+'" style="font-family:var(--sans)">'+(pn.l.split(' ').slice(1).join(' ')||pn.u)+'</text>';
    o+='<text x="'+(ml-5)+'" y="'+(y0+9)+'" text-anchor="end">'+mx.toFixed(pn.d||0)+'</text><text x="'+(ml-5)+'" y="'+(y0+ph)+'" text-anchor="end">'+mn.toFixed(pn.d||0)+'</text>';
    pn.s.forEach(function(s){var pts=[];s[0].forEach(function(v,i){if(typeof v==='number')pts.push([X(i),Y(v),v,i]);});
      o+='<polyline fill="none" stroke="'+s[1]+'" stroke-width="2" stroke-linejoin="round" points="'+pts.map(function(q){return q[0]+','+q[1].toFixed(1);}).join(' ')+'"/>';
      pts.forEach(function(q){var f=pn.lo!=null?flagOf(q[2],pn.lo,pn.hi):'';o+='<circle cx="'+q[0]+'" cy="'+q[1].toFixed(1)+'" r="'+(f?4:2.5)+'" fill="'+(f?'var(--crit)':s[1])+'" stroke="var(--surface-2)" stroke-width="1"/><circle cx="'+q[0]+'" cy="'+q[1].toFixed(1)+'" r="11" fill="transparent" data-tip="'+esc(pn.l+(s[2]?' '+s[2]:'')+' '+q[2]+' '+pn.u+' · '+dt(g.times[q[3]]))+'"/>';});
      var e=pts[pts.length-1];if(e)o+='<text x="'+(e[0]+8)+'" y="'+(e[1]+4)+'" style="fill:var(--ink);font-weight:500">'+e[2]+(s[2]?' '+s[2].slice(0,3):'')+'</text>';});});
  var yb=P.length*(ph+gap)+6,last=-99,pd='';
  g.times.forEach(function(t,i){if(X(i)-last<44)return;last=X(i);o+='<text x="'+X(i)+'" y="'+yb+'" text-anchor="middle">'+hm(t)+'</text>';if(dm(t)!==pd){o+='<text x="'+X(i)+'" y="'+(yb+13)+'" text-anchor="middle">'+dm(t)+'</text>';pd=dm(t);}});
  return o+'</svg></div><p class="muted" style="margin:6px 0 0">Green bands mark this patient’s expected range. Red points are outside it. Hover a point for its value.</p>';
}

/* ---------- medications ---------- */
function aMeds(p,c){
  var hrs=[],ms0=c.marStart||marNow();for(var i=0;i<16;i++)hrs.push(new Date(ms0.getTime()+i*3600000));
  var lab={given:'Given',held:'Held',due:'Due',over:'Overdue',sched:'Sched.'};
  function isNow(h){return NOW>=h&&NOW-h<3600000;}
  function row(m){
    var head='<td class="st medname"><b>'+esc(m.name)+'</b><span>'+esc(m.sig)+'</span></td>';
    if(m.type==='inf')return '<tr>'+head+'<td colspan="16"><span class="inf">Running · <b>'+esc(m.rate)+'</b></span> <span class="muted">'+esc(m.note||'')+'</span></td></tr>';
    return '<tr>'+head+hrs.map(function(h){var cs=[];m.a.forEach(function(a,ai){if(a.t>=h&&a.t-h<3600000){var s=doseState(a);cs.push('<button class="mcell '+s+'" data-a="adm" data-v="'+m.id+','+ai+'" data-tip="'+esc(lab[s]+' '+hm(a.t)+(a.by?' · '+a.by:'')+(a.note?' · '+a.note:''))+'"><t>'+hm(a.t)+'</t>'+lab[s]+'</button>');}});
      if(m.type==='prn'&&isNow(h))cs.push('<button class="mcell sched" data-a="adm" data-v="'+m.id+',-1"><t>'+hm(NOW)+'</t>Give</button>');
      return '<td class="'+(isNow(h)?'nowc':'')+'">'+cs.join('')+'</td>';}).join('')+'</tr>';}
  var groups=[['Continuous infusions',function(m){return m.type==='inf';}],['Scheduled',function(m){return !m.type;}],['As needed',function(m){return m.type==='prn';}]];

function insertText(p,k){
  if(k==='vitals'){var v=vit(p);return 'Vitals ('+dt(v.t)+'): temp '+num(v.temp,1)+' °C, heart rate '+v.hr+', blood pressure '+v.bp+' (mean '+v.map+'), respiratory rate '+v.rr+', saturation '+v.spo2+'% on '+String(v.o2).toLowerCase()+', pain '+v.pain+'/10.\n';}
  if(k==='labs')return p.labs.map(function(L){var i=L.times.length-1;return L.panel+' ('+dt(L.times[i])+'): '+L.rows.filter(function(r){return r[4][i]!=null;}).map(function(r){var f=flagOf(r[4][i],r[2],r[3]);return r[0].toLowerCase()+' '+r[4][i]+(f?(f==='hi'?' (H)':' (L)'):'');}).join(', ')+'.';}).join('\n')+'\n';
  if(k==='meds')return 'Active medications:\n'+p.meds.map(function(m){return '- '+m.name+', '+m.sig.toLowerCase()+(m.rate?' ('+m.rate+')':'');}).join('\n')+'\n';

}

  var nx=+g.times[g.times.length-1]+iv;while(nx<=START)nx+=iv;for(var i=0;i<2&&nx<=h1;i++,nx+=iv)out.push({t:new Date(nx),kind:'Vitals',cls:'mute',text:'Vital signs, '+(iv===3600000?'hourly':'every 4 hours'),pid:p.id,go:'flows'});

  out.push({t:nextAt([6,14,22]),kind:'Assessment',cls:'mute',text:'Intake and output totals for the shift',pid:p.id,go:'flows'});

     var fb=function(){var pre=gid('data-json'),r=document.createRange(),s=window.getSelection();if(!pre)return;r.selectNodeContents(pre);s.removeAllRanges();s.addRange(r);pre.focus();toast('The text shown is selected. Press Ctrl+C or Cmd+C to copy it.');};
     try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(o).then(function(){toast('JSON copied ('+Math.round(o.length/1024)+' KB)');},fb);else fb();}catch(e){fb();}
     return false;
   default:return false;
  }
  return true;
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(t&&!t.disabled)act(t.dataset.a,t.dataset.v,e);

  if(e.key==='Enter'&&e.target.matches('tr[data-a],td[data-a]'))act(e.target.dataset.a,e.target.dataset.v,{detail:e.target.matches('tr')?2:1});});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='ord-q')ordSearch(t.value);
  if(t.id==='lab-q')labFilter(t);
  if(t.id==='icd-q')icdSearch(t.value);
  if(t.id==='img-br'){var cv=document.querySelector('canvas.cxr'),pc=PT(S.view);if(cv&&pc){S.c[pc.id].img.br=+t.value;cv.style.filter='invert('+(S.c[pc.id].img.inv?1:0)+') brightness('+t.value+'%)';}}
  if(t.id==='oc-mgkg'){var kw=+t.dataset.wt,kn=parseFloat(t.value),ko=gid('oc-calc');if(!kw||!(kn>0)){ko.textContent='—';ko.dataset.val='';}else{var kd=kn*kw,kr=kd>=100?Math.round(kd/5)*5:(kd>=10?Math.round(kd):Math.round(kd*10)/10);ko.textContent=kr.toLocaleString('en-US')+' '+t.dataset.un;ko.dataset.val=ko.textContent;}}

  if(t.id==='dc-instr')S.c[t.dataset.pid].dc.instr=t.value;
  if(t.id==='nt-body'){var pos=t.selectionStart,m=/\.(vitals|labs|meds|problems|name|age|allergies)\s$/.exec(t.value.slice(0,pos));
    if(m){var ins=insertText(PT(t.dataset.pid),m[1]);t.value=t.value.slice(0,pos-m[0].length)+ins+(/\n$/.test(ins)?'':' ')+t.value.slice(pos);var np=pos-m[0].length+ins.length+(/\n$/.test(ins)?0:1);t.setSelectionRange(np,np);}}
});

  if(t.dataset.dcrec){q=t.dataset.dcrec.split(',');S.c[q[0]].dc.rec[q[1]]=t.value;draw();return;}
  if(t.dataset.cdprin){q=t.dataset.cdprin.split(',');S.c[q[0]].cd.principal=q[1];draw();return;}
  if(t.dataset.cdlev){S.c[t.dataset.cdlev].cd.level=t.value;t.blur();}
  if(t.dataset.change==='datap'){S.data.pid=t.value;S.data.type='All';S.data.sub='';draw();return;}
  if(t.dataset.change==='cnp'){gid('cn-m').innerHTML=teamOpts(PT(t.value));}
  if(t.dataset.ho){var h=t.dataset.ho.split(',');S.ho[h[0]][h[1]]=t.value;if(t.tagName==='SELECT')t.blur();}
  if(t.dataset.rec){var r=t.dataset.rec.split(',');S.c[r[0]].rec[r[1]]=t.value;t.blur();}
  if(t.dataset.change==='tpl'&&t.value){var b=document.getElementById('nt-body');b.value=tplText(PT(b.dataset.pid),t.value);b.focus();}if(e.target.dataset.change==='pickord'&&e.target.value){S.dlg={type:'ord',k:e.target.value};draw();}});
document.getElementById('gsearch').addEventListener('input',function(e){var q=e.target.value.trim().toLowerCase(),box=document.getElementById('gres');
